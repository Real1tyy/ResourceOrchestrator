# ─── Quality-gate checks (repo-owned) ─────────────────────────────────────────
# REPO-OWNED — seeded once by `agenticd init`, never overwritten. The task NAMES are
# the harness contract (the gate entrypoints in tasks/harness/gates.toml delegate to
# these by name); the bodies are this repo's real commands.
#
# Checks that need tooling/artifacts this skeleton does not have yet (secrets scan,
# SAST, OpenAPI/entity drift) are honest exit-0 stubs with a note — they get a real
# body when the subsystem they guard lands via a spec. Prefix-less syntax is mandatory.

[check]
description = "All static checks — the repo aggregate"
depends = ["check:gates"]

["check:gates"]
description = "The cacheable check aggregate: backend + frontend + spelling"
depends = ["check:backend", "check:frontend", "check:spelling"]

["check:frontend"]
description = "Frontend checks (format + lint + typecheck + build + unit tests)"
run = "pnpm -C apps/web run check"

["check:dead-code:frontend"]
description = "Detect unused exports/files/dependencies in the frontend (wired when the UI grows)"
run = 'echo "check:dead-code:frontend: no UI surface to scan yet"; exit 0'

["check:backend:compile"]
description = "Backend compile + lint (clippy, no tests)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

["check:backend"]
description = "Backend gate: compile + lint + unit/integration tests (nextest)"
depends = ["check:backend:compile"]
# --no-tests=pass: an empty-skeleton crate with no tests yet is not a failure.
run = "cargo nextest run --workspace --no-tests=pass"

["check:backend:slow"]
description = "Backend slow/ignored-test gate (human-only, rides in ci-full)"
run = "cargo nextest run --workspace --run-ignored ignored-only --no-tests=pass"

["check:git-subprocess"]
description = "Guard: forbid raw git subprocesses outside the sanctioned builder (no Rust git layer yet)"
run = 'echo "check:git-subprocess: no backend git layer to scan yet"; exit 0'

["check:doc-names"]
description = "Enforce collision-free doc filenames + unique ids"
run = "python3 scripts/guards/guard_doc_names.py"

["check:schema-names"]
description = "Guard: forbid duplicate generated schema names (no generated schemas yet)"
run = 'echo "check:schema-names: no generated schemas yet"; exit 0'

["check:contract"]
description = "API contract drift (generated client vs OpenAPI spec) — wired with the API spec (MVP-2)"
run = 'echo "check:contract: no OpenAPI surface yet"; exit 0'

["check:entities"]
description = "DB entity drift check — wired with the SQLite schema (MVP-1)"
run = 'echo "check:entities: no DB schema yet"; exit 0'

["check:spelling"]
description = "Spell-check the repo"
run = "typos"

["check:security"]
description = "Dependency policy + vulnerability scan (cargo-deny) — wired when crates take dependencies"
run = 'echo "check:security: workspace has no third-party deps yet"; exit 0'

["check:secrets"]
description = "Scan the working tree for committed secrets (wire gitleaks when secrets exist)"
run = 'echo "check:secrets: not yet configured"; exit 0'

["check:secrets:history"]
description = "Scan full git history for secrets (slow; human/CI)"
run = 'echo "check:secrets:history: not yet configured"; exit 0'

["check:sast"]
description = "Static Application Security Testing scan (wired when there is application code)"
run = 'echo "check:sast: not yet configured"; exit 0'

["check:sast:ci"]
description = "SAST scan with SARIF output (CI mirror)"
run = 'echo "check:sast:ci: not yet configured"; exit 0'
