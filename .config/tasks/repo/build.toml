# ─── Build + lint + format + typecheck (repo-owned) ───────────────────────────
# REPO-OWNED — seeded once by `agenticd init`, never overwritten afterward. The task
# NAMES are the harness contract; the bodies are this repo's real commands.
#
# `cargo fmt` / `cargo nextest` are deliberately driven through these mise tasks (not
# bare agent Bash): the policy hook allow-lists `mise run <task>`, and mise runs the
# real tool in a child process. Prefix-less task syntax is mandatory in an included file.

[lint]
description = "Lint (clippy, warnings-as-errors) across the whole workspace"
run = "cargo clippy --workspace --all-targets -- -D warnings"

# `cargo +$RUSTFMT_TOOLCHAIN fmt` pins rustfmt to the toolchain in rust-toolchain.toml so a
# leaked RUSTUP_TOOLCHAIN can't make the gate format differently from a clean shell.
[format]
description = "Auto-format the whole tree (rustfmt + prettier)"
run = [
  "cargo +${RUSTFMT_TOOLCHAIN} fmt --all",
  "pnpm -C apps/web run format",
]

["format:check"]
description = "Check formatting without writing (rustfmt + prettier)"
run = [
  "cargo +${RUSTFMT_TOOLCHAIN} fmt --all --check",
  "pnpm -C apps/web run format:check",
]

[typecheck]
description = "Type-check the frontend (tsc --noEmit); the backend is type-checked by `cargo clippy`"
run = "pnpm -C apps/web run typecheck"

[build]
description = "Build backend (workspace) + frontend (vite)"
run = [
  "cargo build --workspace",
  "pnpm -C apps/web run build",
]

["build:e2e"]
description = "Debug build the artifacts the agent e2e gate needs (roch binary + frontend)"
run = [
  "cargo build -p roch-cli",
  "pnpm -C apps/web run build",
]
