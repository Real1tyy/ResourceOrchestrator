# ─── Dev + serve + daemon (repo-owned) ────────────────────────────────────────
# REPO-OWNED — seeded once, never overwritten. The backend is a skeleton (no server
# loop yet), so `dev:backend`/`serve:*` run the `roch` binary as a placeholder until the
# daemon lands (MVP-1). `daemon:*` (systemd --user service mgmt) is wired with the
# packaging spec. Prefix-less task syntax is mandatory in an included task file.

[dev]
description = "Run the frontend dev server (Vite). Backend dev server lands with the daemon (MVP-1)."
run = "pnpm -C apps/web run dev"

["dev:backend"]
description = "Run the backend (placeholder: builds + runs the roch skeleton)"
run = "cargo run -p roch-cli"

["dev:web"]
description = "Run the frontend dev server (Vite, HMR)"
run = "pnpm -C apps/web run dev"

[serve]
description = "Run the frontend preview build. Combined backend+frontend serve lands with the daemon."
run = "pnpm -C apps/web run preview"

["serve:backend"]
description = "Run the backend release build (placeholder until the daemon lands)"
run = "cargo run --release -p roch-cli"

["serve:frontend"]
description = "Run the frontend dev server with HMR"
run = "pnpm -C apps/web run dev"

["daemon:install"]
description = "Install the long-running user service (wired with the packaging spec)"
run = 'echo "daemon:install: not yet configured (no service to install)"; exit 0'

["daemon:restart"]
description = "Rebuild + restart the running service"
run = 'echo "daemon:restart: not yet configured"; exit 0'

["daemon:status"]
description = "Show the service status"
run = 'echo "daemon:status: not yet configured"; exit 0'

["daemon:logs"]
description = "Follow the service logs"
run = 'echo "daemon:logs: not yet configured"; exit 0'

["daemon:uninstall"]
description = "Stop, disable, and remove the service"
run = 'echo "daemon:uninstall: not yet configured"; exit 0'
