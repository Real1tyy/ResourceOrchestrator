# ─── Tests + change report (repo-owned) ───────────────────────────────────────
# REPO-OWNED — seeded once, never overwritten. NAMES are the harness contract.
# Backend tests run through `cargo nextest`; frontend unit through vitest; e2e through
# Playwright. Prefix-less task syntax is mandatory in an included task file.

[test]
description = "Full test suite (backend nextest + frontend unit)"
run = [
  "cargo nextest run --workspace --no-tests=pass",
  "pnpm -C apps/web run test",
]

["test:unit"]
description = "Unit tests (backend nextest + frontend vitest)"
run = [
  "cargo nextest run --workspace --lib --bins --no-tests=pass",
  "pnpm -C apps/web run test",
]

["test:integration"]
description = "Integration tests (Rust tests/ directory targets)"
run = "cargo nextest run --workspace --test '*' --no-tests=pass"

["test:e2e"]
description = "Full Playwright end-to-end suite (human-only)"
run = "pnpm -C apps/web run e2e"

["test:e2e:changed"]
description = "E2e for specs changed by this worktree (the agent gate). Until a spec→test map exists, runs the (small) Playwright suite."
run = "pnpm -C apps/web run e2e"

["test:e2e:changed:dirty"]
description = "E2e for changed specs including uncommitted"
run = "pnpm -C apps/web run e2e"

["test:e2e:install"]
description = "Install the Playwright browser (chromium) the e2e suite needs"
run = "pnpm -C apps/web exec playwright install chromium"

["test:stress"]
description = "Backend stress/load harness (crates/roch-stress) — N-agents-at-once load scenario"
run = "cargo run --profile profiling -p roch-stress"

["test:scripts"]
description = "Test the scripts/ helpers (none have tests yet)"
run = 'echo "test:scripts: no script tests yet"; exit 0'

[change-report]
description = "Summarize this worktree's diff vs main (used by the pre-stop hand-off gate)"
run = "git --no-pager diff --stat \"$(git merge-base main HEAD 2>/dev/null || echo HEAD)\"...HEAD 2>/dev/null || true"
