# .config/mise.toml — task harness orchestrator seeded by `agenticd init`.
#
# This file is an ORCHESTRATOR ONLY: tool versions, env, and the
# `task_config.includes` table of contents — no task bodies. Every task lives in a
# concern-grouped include file under .config/tasks/, split into two trees by
# ownership (spec-mise-task-file-restructuring):
#
#   • tasks/harness/* — HARNESS-OWNED. Synced authoritatively by `agenticd init`
#     (Tier-1 managed mirror). Do NOT hand-edit; a local change is reset on the
#     next init. To change one, edit the bundle template under
#     crates/agenticd-claude/assets/tasks/harness/* and re-run init.
#   • tasks/repo/* — REPO-OWNED. `agenticd init` seeds these once (the no-op stubs
#     below) and never overwrites them afterward. Replace each stub `run` body with
#     your stack's real command; the task NAMES are the stable harness contract.
#
# Include paths resolve relative to the PROJECT ROOT (mise's config_root, the parent
# of .config/), NOT to .config/ — so each entry is `.config/tasks/...`. `includes`
# REPLACES mise's default file-task search, so every file must be listed explicitly.
#
# Install mise: https://mise.jdx.dev/getting-started.html
# Run a task:   mise run <task>   (or: mise <task>)

[tools]
# Tools mise installs + pins for every contributor and agent. The Rust toolchain is
# pinned separately in rust-toolchain.toml (rustup reads it); everything non-Rust lives
# here. Heavier/optional tooling (cargo-flamegraph, hyperfine, oha) is documented in
# docs/TOOLS.md and installed on demand rather than forced into every checkout.
node = "22"
pnpm = "latest"
lefthook = "latest"        # git-hook orchestrator (lefthook.yml)
cocogitto = "latest"       # `cog` — Conventional Commits verifier (cog.toml)
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"  # project test runner (prebuilt; faster than `cargo test`)
typos = "latest"           # spell-checker (check:spelling)
# Compile cache (.cargo/config.toml drives it via rustc-wrapper = "sccache"). Pin a current
# release so SCCACHE_BASEDIRS (cross-checkout cache-key normalization) is available.
# CAVEAT: `~/.cargo/bin` is AHEAD of mise on PATH, so a hand-installed `~/.cargo/bin/sccache`
# SHADOWS this pin — remove/upgrade it, then `sccache --stop-server` once.
"aqua:mozilla/sccache" = "0.15.0"
# Added when the subsystem that needs them lands:
#   cargo-deny  → check:security (once crates take third-party deps)
#   hyperfine, flamegraph → perf tooling (see docs/TOOLS.md)

[env]
# rustfmt toolchain pin: the fmt tasks run `cargo +$RUSTFMT_TOOLCHAIN fmt` so a leaked
# RUSTUP_TOOLCHAIN can't make the gate format differently from a clean shell. MUST equal the
# `channel` in ./rust-toolchain.toml.
RUSTFMT_TOOLCHAIN = "1.96.0"
# Build-pipeline parallelism cap. When the gate governor exists it exports AGENTIC_GATE_JOBS
# (one shared core budget divided across concurrent gate slots); `get_env` reads it so the
# nested `mise run` doesn't clobber the governor's value. Ungoverned default: 8.
CARGO_BUILD_JOBS = "{{ get_env(name='AGENTIC_GATE_JOBS', default='8') }}"
NEXTEST_TEST_THREADS = "{{ get_env(name='AGENTIC_GATE_JOBS', default='8') }}"

[task_config]
# `includes` REPLACES mise's default file-task search — every task file MUST be
# listed here or its tasks silently vanish. Paths are project-root-relative.
includes = [
  # HARNESS-OWNED (init-synced; do not hand-edit — edit the bundle + run init):
  ".config/tasks/harness/worktree.toml",
  ".config/tasks/harness/gates.toml",
  ".config/tasks/harness/commit.toml",
  ".config/tasks/harness/hooks.toml",
  # REPO-OWNED (seeded once; replace the stub bodies with your stack's commands):
  ".config/tasks/repo/checks.toml",
  ".config/tasks/repo/tests.toml",
  ".config/tasks/repo/build.toml",
  ".config/tasks/repo/dev.toml",
  ".config/tasks/repo/codegen.toml",
]
