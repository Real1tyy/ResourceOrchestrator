# Pin the Rust toolchain so every contributor and agent builds with the same compiler.
# rustup reads this automatically; mise manages the non-Rust tools (.config/mise.toml).
# `channel` MUST equal RUSTFMT_TOOLCHAIN in .config/mise.toml (the fmt-gate consistency pin).
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
